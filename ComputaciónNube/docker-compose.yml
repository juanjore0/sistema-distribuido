# Laboratorio Grupo 6: asistente de IA en la nube (UTP - Sistemas Distribuidos)
# Levantar:   docker compose up --build -d
# Ver logs:   docker compose logs -f balanceador
x-nodo: &nodo
  build: { context: ., dockerfile: nodo/Dockerfile }
  restart: always                       # si el proceso muere, Docker lo reinicia
  environment: &env_nodo
    CAPACIDAD: "2"                      # inferencias simultáneas por "GPU"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=1)"]
    interval: 5s
    timeout: 2s
    retries: 2

services:
  ia-node-1:
    <<: *nodo
    environment: { <<: *env_nodo, NODE_ID: ia-node-1 }
    ports: ["8001:8000"]
  ia-node-2:
    <<: *nodo
    environment: { <<: *env_nodo, NODE_ID: ia-node-2 }
    ports: ["8002:8000"]
  ia-node-3:
    <<: *nodo
    environment: { <<: *env_nodo, NODE_ID: ia-node-3 }
    ports: ["8003:8000"]

  # Balanceador principal: 3 nodos
  balanceador:
    build: { context: ., dockerfile: balanceador/Dockerfile }
    restart: always
    environment:
      NODOS: http://ia-node-1:8000,http://ia-node-2:8000,http://ia-node-3:8000
      ALGORITMO: rr                     # rr = Round Robin, lc = Least Connections
      INTERVALO_HC: "1"
    ports: ["8080:8000"]
    depends_on: [ia-node-1, ia-node-2, ia-node-3]

  # Escenario de comparación: el mismo balanceador con un solo nodo
  balanceador-1nodo:
    build: { context: ., dockerfile: balanceador/Dockerfile }
    restart: always
    environment:
      NODOS: http://ia-node-1:8000
    ports: ["8081:8000"]
    depends_on: [ia-node-1]
