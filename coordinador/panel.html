<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archivos distribuidos</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #67707c;
      --border: #e3e6ea;
      --accent: #3b5bdb;
      --accent-soft: #e8edff;
      --ok: #2f9e44;
      --ok-soft: #e6f6ea;
      --down: #e03131;
      --down-soft: #fdecec;
      --warn: #e8590c;
      --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 4px 12px rgba(16, 24, 40, .04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --card: #1a1e24;
        --text: #e8eaed;
        --muted: #9aa3ad;
        --border: #2b3139;
        --accent: #748ffc;
        --accent-soft: #232b45;
        --ok: #51cf66;
        --ok-soft: #1c3324;
        --down: #ff6b6b;
        --down-soft: #3a1f22;
        --warn: #ff922b;
        --shadow: none;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 48px; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap; margin-bottom: 24px;
    }
    h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
    .subtitle { margin: 2px 0 0; color: var(--muted); }
    h2 { margin: 0 0 14px; font-size: 16px; }

    .pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--muted); font-size: 13px;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
    .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
    .dot.down { background: var(--down); box-shadow: 0 0 0 3px var(--down-soft); }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px; box-shadow: var(--shadow);
    }

    /* Nodos */
    .nodes {
      display: grid; gap: 12px; margin-bottom: 16px;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    }
    .node { display: flex; flex-direction: column; gap: 4px; border-top: 3px solid var(--muted); }
    .node.ok { border-top-color: var(--ok); }
    .node.down { border-top-color: var(--down); }
    .node-head { display: flex; align-items: center; justify-content: space-between; }
    .node-name { font-weight: 600; font-size: 16px; }
    .badge {
      font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    }
    .badge.ok { background: var(--ok-soft); color: var(--ok); }
    .badge.down { background: var(--down-soft); color: var(--down); }
    .node-meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }

    /* Subir */
    .grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
    .grid > *, .side > * { min-width: 0; }
    /* En pantallas angostas: subir, archivos y eventos, en ese orden */
    .side { display: contents; }
    #upload-card { order: 1; }
    #files-card { order: 2; }
    #events-card { order: 3; }
    .drop {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; padding: 28px 16px; text-align: center; cursor: pointer;
      border: 2px dashed var(--border); border-radius: 12px; color: var(--muted);
      transition: border-color .15s, background .15s;
    }
    .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
    .drop strong { color: var(--text); }
    .drop input { display: none; }
    .upload-row { display: flex; gap: 12px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
    .chosen { flex: 1; min-width: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    button {
      font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
      border-radius: 9px; padding: 8px 14px; border: 1px solid transparent;
      transition: filter .15s, background .15s;
    }
    button:disabled { opacity: .5; cursor: default; }
    .primary { background: var(--accent); color: #fff; }
    .primary:not(:disabled):hover { filter: brightness(1.08); }
    .ghost { background: transparent; border-color: var(--border); color: var(--text); padding: 6px 10px; }
    .ghost:not(:disabled):hover { background: var(--accent-soft); }
    .danger { background: transparent; border-color: var(--border); color: var(--down); padding: 6px 10px; }
    .danger:not(:disabled):hover { background: var(--down-soft); }

    .result { margin-top: 12px; font-size: 14px; min-height: 1.5em; }
    .result.error { color: var(--down); }

    /* Tabla */
    .table-wrap { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th {
      text-align: left; font-size: 12px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .04em;
      padding: 0 10px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    td { padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    th.center, td.center { text-align: center; }
    .fname { font-weight: 600; overflow-wrap: anywhere; }
    .fmeta { color: var(--muted); font-size: 12px; }
    .copy {
      display: inline-block; width: 26px; height: 26px; line-height: 26px; border-radius: 7px;
      font-size: 13px; font-weight: 700;
    }
    .copy.ok { background: var(--ok-soft); color: var(--ok); }
    .copy.down { background: var(--down-soft); color: var(--down); }
    .copy.none { color: var(--border); }
    .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; color: var(--muted); font-size: 12px; align-items: center; }
    .legend .copy { width: 20px; height: 20px; line-height: 20px; font-size: 11px; text-align: center; margin-right: 4px; }
    .actions { display: flex; gap: 6px; justify-content: flex-end; }
    td:first-child { min-width: 150px; }
    @media (max-width: 560px) {
      .actions { flex-direction: column; align-items: stretch; }
    }
    .empty { text-align: center; color: var(--muted); padding: 28px 0 12px; }
    .warn { color: var(--warn); font-weight: 600; }

    /* Eventos */
    .events {
      list-style: none; margin: 0; padding: 0; max-height: 240px; overflow-y: auto;
      font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .events li { padding: 3px 0; border-bottom: 1px dashed var(--border); overflow-wrap: anywhere; }
    .events li:last-child { border-bottom: none; }
    .events .down { color: var(--down); }
    .events .ok { color: var(--ok); }
    .events .warn { color: var(--warn); }

    /* Aviso flotante */
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
      max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 10px;
      background: var(--text); color: var(--bg); font-size: 14px; font-weight: 500;
      opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { background: var(--down); color: #fff; }

    @media (min-width: 820px) {
      .grid { grid-template-columns: 340px minmax(0, 1fr); align-items: start; }
      .side { display: grid; gap: 16px; order: 1; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Archivos distribuidos</h1>
      <p class="subtitle">Sube, descarga y administra tus archivos. Cada uno se guarda en dos nodos.</p>
    </div>
    <span class="pill" id="live"><span class="dot"></span><span>Conectando…</span></span>
  </header>

  <section class="nodes" id="nodes" aria-label="Estado de los nodos"></section>

  <div class="grid">
    <div class="side">
      <section class="card" id="upload-card">
        <h2>Subir archivo</h2>
        <label class="drop" id="drop">
          <input type="file" id="file">
          <strong>Arrastra un archivo aquí</strong>
          <span>o haz clic para elegirlo</span>
        </label>
        <div class="upload-row">
          <span class="chosen" id="chosen">Ningún archivo seleccionado</span>
          <button class="primary" id="upload" disabled>Subir</button>
        </div>
        <div class="result" id="result"></div>
      </section>

      <section class="card" id="events-card">
        <h2>Eventos recientes</h2>
        <ul class="events" id="events"></ul>
      </section>
    </div>

    <section class="card" id="files-card">
      <h2 id="files-title">Archivos</h2>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="legend">
        <span><span class="copy ok">✓</span>Copia en un nodo activo</span>
        <span><span class="copy down">✓</span>Copia en un nodo caído</span>
        <span><span class="copy none">—</span>Sin copia</span>
      </div>
    </section>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const api = (nombre) => "/api/files/" + encodeURIComponent(nombre);

  let nodes = [];
  let lastFiles = "";
  let lastStatus = "";
  let selected = null;

  // ---------- utilidades ----------
  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (key === "class") node.className = value;
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value);
    }
    for (const child of children) {
      if (child != null) node.append(child);
    }
    return node;
  }

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + " B";
    const units = ["KB", "MB", "GB"];
    let value = bytes / 1024, i = 0;
    while (value >= 1024 && i < units.length - 1) { value /= 1024; i++; }
    return value.toFixed(value < 10 ? 1 : 0) + " " + units[i];
  }

  function formatDate(iso) {
    if (!iso) return "recuperado de un nodo";
    return new Date(iso).toLocaleString("es", { dateStyle: "short", timeStyle: "short" });
  }

  let toastTimer;
  function toast(message, isError = false) {
    const box = $("toast");
    box.textContent = message;
    box.className = "toast show" + (isError ? " error" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (box.className = "toast"), 4000);
  }

  async function errorMessage(response) {
    try { return (await response.json()).error || response.statusText; }
    catch { return response.statusText || "Error " + response.status; }
  }

  // ---------- render ----------
  function renderStatus(status) {
    nodes = status.nodes;

    $("nodes").replaceChildren(...nodes.map((node) => {
      const state = node.alive ? "ok" : "down";
      const host = node.url.replace(/^https?:\/\//, "");
      return el("article", { class: `card node ${state}` },
        el("div", { class: "node-head" },
          el("span", { class: "node-name" }, node.id),
          el("span", { class: `badge ${state}` }, node.alive ? "Activo" : "Caído")),
        el("span", { class: "node-meta" }, node.hostname || "equipo desconocido"),
        el("span", { class: "node-meta" }, host),
        el("span", { class: "node-meta" },
          `${node.files} ${node.files === 1 ? "archivo" : "archivos"}`));
    }));

    $("events").replaceChildren(...(status.events.length
      ? status.events.map((line) => {
          const cls = /CAÍDO|PERDIDO|no respondió|dañado|Error/.test(line) ? "down"
            : /ACTIVO|servido por|guardado en|re-replicado/.test(line) ? "ok"
            : /ADVERTENCIA|pendiente|conflicto/.test(line) ? "warn" : "";
          return el("li", { class: cls }, line);
        })
      : [el("li", {}, "Sin eventos todavía")]));
  }

  function renderFiles(files) {
    $("files-title").textContent = `Archivos (${files.length})`;

    $("thead").replaceChildren(el("tr", {},
      el("th", {}, "Archivo"),
      ...nodes.map((node) => el("th", { class: "center" }, node.id)),
      el("th", {})));

    if (!files.length) {
      $("tbody").replaceChildren(el("tr", {},
        el("td", { class: "empty", colspan: nodes.length + 2 },
          "Todavía no hay archivos. Sube el primero.")));
      return;
    }

    const alive = Object.fromEntries(nodes.map((node) => [node.id, node.alive]));

    $("tbody").replaceChildren(...files.map((file) => {
      const holders = new Set(file.nodes.map((node) => node.id));
      const meta = [formatBytes(file.size), formatDate(file.uploaded_at)].join(" · ");

      return el("tr", {},
        el("td", {},
          el("div", { class: "fname" }, file.name),
          el("div", { class: "fmeta" }, meta,
            file.available ? null : el("span", { class: "warn" }, " · sin réplicas disponibles"))),
        ...nodes.map((node) => {
          if (!holders.has(node.id)) {
            return el("td", { class: "center" }, el("span", { class: "copy none" }, "—"));
          }
          const ok = alive[node.id];
          return el("td", { class: "center" },
            el("span", {
              class: `copy ${ok ? "ok" : "down"}`,
              title: ok ? `Copia en ${node.id}` : `Copia en ${node.id} (caído)`,
            }, "✓"));
        }),
        el("td", {},
          el("div", { class: "actions" },
            el("button", {
              class: "ghost",
              onclick: (event) => download(file.name, event.currentTarget),
              ...(file.available ? {} : { disabled: "" }),
            }, "Descargar"),
            el("button", {
              class: "danger",
              onclick: (event) => remove(file.name, event.currentTarget),
            }, "Eliminar"))));
    }));
  }

  function setLive(ok) {
    const pill = $("live");
    pill.firstElementChild.className = "dot " + (ok ? "ok" : "down");
    pill.lastElementChild.textContent = ok
      ? "En línea · " + new Date().toLocaleTimeString("es")
      : "Sin conexión con el coordinador";
  }

  // ---------- actualización automática ----------
  async function refresh() {
    try {
      const [statusRes, filesRes] = await Promise.all([fetch("/api/status"), fetch("/api/files")]);
      const statusText = await statusRes.text();
      const filesText = await filesRes.text();

      // Solo se vuelve a dibujar si algo cambió (evita parpadeos y clics perdidos)
      if (statusText !== lastStatus) {
        lastStatus = statusText;
        lastFiles = "";
        renderStatus(JSON.parse(statusText));
      }
      if (filesText !== lastFiles) {
        lastFiles = filesText;
        renderFiles(JSON.parse(filesText).files);
      }
      setLive(true);
    } catch {
      setLive(false);
    }
  }

  // ---------- acciones ----------
  function choose(file) {
    selected = file || null;
    $("chosen").textContent = selected
      ? `${selected.name} (${formatBytes(selected.size)})`
      : "Ningún archivo seleccionado";
    $("upload").disabled = !selected;
    $("result").textContent = "";
  }

  async function upload() {
    if (!selected) return;
    const button = $("upload");
    const result = $("result");
    button.disabled = true;
    button.textContent = "Subiendo…";
    result.className = "result";
    result.textContent = "";

    try {
      const response = await fetch(api(selected.name), { method: "PUT", body: selected });
      if (!response.ok) throw new Error(await errorMessage(response));
      const data = await response.json();
      result.textContent = `✓ ${data.name} quedó en ${data.nodes.join(" y ")}`;
      if (data.nodes.length < 2) {
        result.textContent += " (solo una réplica: no había más nodos disponibles)";
      }
      $("file").value = "";
      selected = null;
      $("chosen").textContent = "Ningún archivo seleccionado";
      refresh();
    } catch (error) {
      result.className = "result error";
      result.textContent = "No se pudo subir: " + error.message;
      button.disabled = false;
    } finally {
      button.textContent = "Subir";
    }
  }

  async function download(nombre, button) {
    button.disabled = true;
    button.textContent = "Descargando…";
    try {
      const response = await fetch(api(nombre));
      if (!response.ok) throw new Error(await errorMessage(response));

      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const link = el("a", { href: url, download: nombre });
      document.body.append(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);

      const servedBy = response.headers.get("X-Served-By");
      const failed = response.headers.get("X-Failed-Nodes");
      toast(`Lo entregó ${servedBy}` + (failed ? ` (falló ${failed.split(",").join(", ")})` : ""));
      refresh();
    } catch (error) {
      toast("No se pudo descargar: " + error.message, true);
    } finally {
      button.disabled = false;
      button.textContent = "Descargar";
    }
  }

  async function remove(nombre, button) {
    if (!confirm(`¿Eliminar "${nombre}" de todos los nodos?`)) return;
    button.disabled = true;
    try {
      const response = await fetch(api(nombre), { method: "DELETE" });
      if (!response.ok) throw new Error(await errorMessage(response));
      const data = await response.json();
      toast(data.complete
        ? `${nombre} eliminado de ${data.deleted_from.join(" y ")}`
        : `${nombre} eliminado; falta borrarlo de ${data.pending.map((p) => p.id).join(", ")} cuando vuelva`);
      refresh();
    } catch (error) {
      toast("No se pudo eliminar: " + error.message, true);
      button.disabled = false;
    }
  }

  // ---------- eventos de la página ----------
  $("file").addEventListener("change", (event) => choose(event.target.files[0]));
  $("upload").addEventListener("click", upload);

  const drop = $("drop");
  ["dragenter", "dragover"].forEach((type) => drop.addEventListener(type, (event) => {
    event.preventDefault();
    drop.classList.add("over");
  }));
  ["dragleave", "drop"].forEach((type) => drop.addEventListener(type, () => drop.classList.remove("over")));
  drop.addEventListener("drop", (event) => {
    event.preventDefault();
    choose(event.dataTransfer.files[0]);
  });

  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
